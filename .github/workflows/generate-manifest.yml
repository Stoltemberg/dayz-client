# GitHub Actions Workflow — Auto-generate manifest after each commit
# Every push to main triggers manifest regeneration and commit
# This ensures the launcher always has the latest file hashes

name: Generate Manifest

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'manifest.json'
      - 'version.json'
      - 'launcher_cache.json'
      - '.github/**'

permissions:
  contents: write

jobs:
  generate-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bump version
        run: python bump_version.py

      - name: Generate manifest
        run: python generate_manifest.py
        env:
          FORCE_MANIFEST_HASH: "1"

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet manifest.json version.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to manifest"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "manifest/version has changes"
          fi

      - name: Commit manifest and version
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json version.json
          git commit -m "chore: update manifest v$(cat version.json | python -c 'import sys,json;print(json.load(sys.stdin)["version"])') [skip ci]"
          git push
